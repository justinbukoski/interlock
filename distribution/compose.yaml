name: interlock

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: interlock
      POSTGRES_PASSWORD: ${INTERLOCK_DB_PASSWORD}
      POSTGRES_DB: interlock
    volumes:
      - interlock-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interlock -d interlock"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [database]

  archive-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: interlock
      POSTGRES_PASSWORD: ${INTERLOCK_ARCHIVE_DB_PASSWORD}
      POSTGRES_DB: interlock_archive
    volumes:
      - interlock-archive-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interlock -d interlock_archive"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [archive-database]

  embedder:
    build:
      context: ./embedder
    restart: unless-stopped
    environment:
      MODEL_ID: BAAI/bge-large-en-v1.5
      HF_HOME: /models
    volumes:
      - interlock-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8840/health')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks: [embedding, model-download]

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/usr/local/bin/interlock-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTERLOCK_MIGRATION_DATABASE_URL: postgresql://interlock:${INTERLOCK_DB_PASSWORD}@postgres:5432/interlock
      INTERLOCK_MIGRATOR_ROLE: interlock
      INTERLOCK_RUNTIME_ROLE: interlock
    networks: [database]

  archive-migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/usr/local/bin/interlock-archive-migrate"]
    restart: "no"
    depends_on:
      archive-postgres:
        condition: service_healthy
    environment:
      INTERLOCK_ARCHIVE_MIGRATION_DATABASE_URL: postgresql://interlock:${INTERLOCK_ARCHIVE_DB_PASSWORD}@archive-postgres:5432/interlock_archive
      INTERLOCK_ARCHIVE_MIGRATOR_ROLE: interlock
      INTERLOCK_ARCHIVE_RUNTIME_ROLE: interlock
    networks: [archive-database]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      archive-migrate:
        condition: service_completed_successfully
      embedder:
        condition: service_healthy
    environment:
      INTERLOCK_DATABASE_URL: postgresql://interlock:${INTERLOCK_DB_PASSWORD}@postgres:5432/interlock
      INTERLOCK_ARCHIVE_DATABASE_URL: postgresql://interlock:${INTERLOCK_ARCHIVE_DB_PASSWORD}@archive-postgres:5432/interlock_archive
      INTERLOCK_AUTH_FILE: /run/interlock/auth.json
      INTERLOCK_LISTEN: 0.0.0.0:8851
      INTERLOCK_TRUSTED_PROXY: "true"
      INTERLOCK_EMBEDDER_URL: http://embedder:8840
      INTERLOCK_EMBEDDING_MODEL: BAAI/bge-large-en-v1.5
      RUST_LOG: interlock=info
    volumes:
      - ./state/auth.json:/run/interlock/auth.json:ro
    user: "${INTERLOCK_UID:-1000}:${INTERLOCK_GID:-1000}"
    ports:
      - "127.0.0.1:${INTERLOCK_PORT:-8851}:8851"
    healthcheck:
      test: ["CMD", "/usr/local/bin/interlock-healthcheck", "--http", "127.0.0.1:8851", "/v6/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Docker does not publish host ports for containers attached only to
    # internal networks. The access network exists solely to make the
    # loopback-only port mapping effective.
    networks: [access, database, archive-database, embedding]

volumes:
  interlock-postgres:
  interlock-archive-postgres:
  interlock-models:

networks:
  access:
  database:
    internal: true
  archive-database:
    internal: true
  embedding:
    internal: true
  model-download:
