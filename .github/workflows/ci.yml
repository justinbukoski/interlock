name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    name: Distribution tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run installer unit tests
        run: python3 -m unittest discover -s distribution/tests
      - name: Run the stale-memory demo
        run: python3 demo/stale_memory_demo.py

  rust:
    name: Rust tests and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
