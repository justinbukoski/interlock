[features]
hooks = true

[mcp_servers.foreman-v6]
enabled = true
required = true
command = "/ABSOLUTE/HOME/.local/bin/foreman-mcp"
env = { FOREMAN_V6_URL = "http://127.0.0.1:8851", FOREMAN_V6_READER_TOKEN_FILE = "/ABSOLUTE/HOME/.config/foreman/v6-reader-token", FOREMAN_V6_WRITER_TOKEN_FILE = "/ABSOLUTE/HOME/.config/foreman/v6-writer-token" }
startup_timeout_sec = 10.0
tool_timeout_sec = 30.0

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = '"$HOME/.local/bin/foreman-memory-gate"'
timeout = 10
statusMessage = "Loading mandatory Foreman memory"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '"$HOME/.local/bin/foreman-memory-gate"'
timeout = 10
statusMessage = "Checking Foreman memory"
