[features]
hooks = true

[mcp_servers.interlock]
enabled = true
required = true
command = "/ABSOLUTE/HOME/.local/bin/interlock-mcp"
env = { INTERLOCK_URL = "http://127.0.0.1:8851", INTERLOCK_READER_TOKEN_FILE = "/ABSOLUTE/HOME/.config/interlock/reader-token", INTERLOCK_WRITER_TOKEN_FILE = "/ABSOLUTE/HOME/.config/interlock/writer-token" }
startup_timeout_sec = 10.0
tool_timeout_sec = 30.0

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = '"$HOME/.local/bin/interlock-gate"'
timeout = 10
statusMessage = "Loading mandatory Interlock memory"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '"$HOME/.local/bin/interlock-gate"'
timeout = 10
statusMessage = "Checking Interlock memory"
