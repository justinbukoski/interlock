[package]
name = "interlock-memory"
version = "6.5.3"
edition = "2024"
license = "MIT"
description = "Fail-closed memory for AI coding agents: scoped recall, supersession semantics, durable capture, MCP."
repository = "https://github.com/justinbukoski/interlock"
readme = "README.md"
keywords = ["ai-agents", "memory", "mcp", "pgvector"]
categories = ["database", "development-tools"]

[lib]
name = "interlock"

[[bin]]
name = "interlock"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
hex = "0.4"
http = "1"
nix = { version = "0.30", features = ["user"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tiktoken-rs = "0.9"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
